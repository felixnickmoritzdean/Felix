      { q: "Welche Farbe ist im Hinduismus besonders heilig und wird bei Zeremonien getragen?", opts: ["Blau","Schwarz","Safrangelb / Orange","Grün"], a: 2, exp: "Safrangelb/Orange ist die heilige Farbe im Hinduismus und steht für Reinheit und Opferbereitschaft." },
      { q: "Was ist ein Bindi?", opts: ["Ein Schmuckstein oder Punkt zwischen den Augenbrauen","Ein Armreif","Ein Fußschmuck","Ein Halsband"], a: 0, exp: "Der Bindi ist ein farbiger Punkt auf der Stirn zwischen den Augenbrauen, traditionell ein Zeichen der Verheiratung." },
      { q: "Wie heißt der heilige Fluss, in dem Hindus rituell baden?", opts: ["Nil","Ganges (Ganga)","Euphrat","Indus"], a: 1, exp: "Der Ganges (Ganga) ist der heiligste Fluss im Hinduismus; ein Bad soll Sünden reinigen." },
      { q: "Was ist ein Rudraksha?", opts: ["Ein heiliger Baum","Eine Perle aus Samen des Rudraksha-Baums für Gebetsketten","Ein Tempeltanz","Ein Opferfeuer"], a: 1, exp: "Rudraksha-Perlen stammen vom Elaeocarpus-Baum und gelten als heilig für Gebetsketten." },
      { q: "Was ist ein Namaste-Gruß?", opts: ["Ein Handschlag","Das Zusammenführen beider Handflächen vor der Brust","Eine Verbeugung bis zum Boden","Ein Umarmung"], a: 1, exp: "Namaste bedeutet 'Ich verbeuge mich vor dem Göttlichen in dir' und wird mit zusammengelegten Händen ausgeführt." },
      { q: "Was ist ein Dhoop?", opts: ["Eine Art Tanz","Ein Räucherstäbchen oder Räucherwerk","Ein Gebetstuch","Ein Musikinstrument"], a: 1, exp: "Dhoop ist Räucherwerk, das bei Puja-Zeremonien verbrannt wird um die Götter anzurufen." },
      { q: "Welches Tier gilt im Hinduismus als heilig?", opts: ["Elefant","Schlange","Kuh","Alle drei"], a: 3, exp: "Kuh, Elefant und Schlange gelten alle als heilig – die Kuh als Symbol der Muttergottheit, der Elefant als Ganesha, die Schlange als Symbol Shivas." },
      { q: "Was ist ein Kurta?", opts: ["Ein langes hemdartiges Obergewand","Ein Wickeltuch","Ein Kopfschmuck","Ein Schuhwerk"], a: 0, exp: "Der Kurta ist ein langes, hemdartig geschnittenes Obergewand für Männer und Frauen." },
      { q: "Was ist ein Kalash?", opts: ["Ein Tempelturm","Ein mit Wasser gefüllter Tonkrug für Rituale","Ein Musikinstrument","Ein Gebetstuch"], a: 1, exp: "Der Kalash ist ein heiliger Tonkrug mit Wasser, Blättern und einer Kokosnuss, der bei Zeremonien verwendet wird." },
      { q: "Was symbolisiert die Lotusblume im Hinduismus?", opts: ["Krieg und Stärke","Reinheit, Schönheit und göttliche Vollkommenheit","Trauer und Verlust","Reichtum und Macht"], a: 1, exp: "Der Lotus symbolisiert Reinheit und göttliche Vollkommenheit – viele Götter sitzen auf einem Lotus." },
      { q: "Was ist ein Mangalsutra?", opts: ["Ein heiliges Buch","Eine Halskette die ein verheirateter Mann seiner Frau anlegt","Ein Tempelopfer","Ein rituelles Bad"], a: 1, exp: "Das Mangalsutra ist eine schwarze und goldene Halskette, die der Bräutigam der Braut bei der Hochzeit anlegt." },
      { q: "Wie heißt das traditionelle Hochzeitsgewand der hinduistischen Braut?", opts: ["Weißer Sari","Roter oder pinker Sari","Schwarzes Gewand","Blaues Kleid"], a: 1, exp: "Die hinduistische Braut trägt traditionell einen roten oder pinkfarbenen Sari, da Rot Glück und Fruchtbarkeit symbolisiert." },
      { q: "Was ist Sindoor?", opts: ["Ein Gewürz","Ein rotes Pulver das verheiratete Frauen im Scheitel tragen","Ein Räucherwerk","Ein Blumenopfer"], a: 1, exp: "Sindoor ist rotes Puder, das verheiratete Hindu-Frauen im Haaransatz als Zeichen ihrer Ehe tragen." },
      { q: "Was ist ein Yantra?", opts: ["Ein Tanz","Ein geometrisches Diagramm zur Meditation und Verehrung von Gottheiten","Ein Musikinstrument","Ein Gebetstuch"], a: 1, exp: "Ein Yantra ist ein geometrisches Diagramm, ähnlich dem Mandala, das zur Meditation und Gottesverehrung genutzt wird." },
      { q: "Was ist Vibhuti?", opts: ["Eine Gottheit","Heilige Asche die auf den Körper aufgetragen wird","Ein Gebet","Ein Tempel"], a: 1, exp: "Vibhuti ist heilige Asche, die Shiva-Gläubige auf Stirn und Körper auftragen als Zeichen der Vergänglichkeit." }
    ]
  }
};

let currentQuiz = null, currentQ = 0, score = 0;

function goHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('quiz-header').classList.remove('show');
  document.getElementById('quiz-main').classList.remove('show');
}

function initQuiz(type) {
  currentQuiz = type;
  currentQ = 0;
  score = 0;
  const q = QUIZZES[type];
  document.getElementById('home').style.display = 'none';
  const hdr = document.getElementById('quiz-header');
  hdr.classList.add('show');
  document.getElementById('hdr-subtitle').textContent = q.sublabel;
  document.getElementById('hdr-subtitle').className = 'subtitle ' + q.color;
  document.getElementById('hdr-title').innerHTML = `${q.label}:<br><span class="${q.color}">Gegenstände & Kleidung</span>`;
  document.getElementById('quiz-main').classList.add('show');
  renderQuestion();
}

function renderQuestion() {
  const q = QUIZZES[currentQuiz];
  const qData = q.questions[currentQ];
  const pct = (currentQ / q.questions.length) * 100;
  document.getElementById('main-content').innerHTML = `
    <div class="quiz-header">
      <span class="q-counter">Frage ${currentQ+1} von ${q.questions.length}</span>
      <span class="score-badge">✦ ${score} Punkte</span>
    </div>
    <div class="progress-bar"><div class="progress-fill ${q.color}" style="width:${pct}%"></div></div>
    <div class="question-card ${q.color}"><p class="question-text">${qData.q}</p></div>
    <div class="answers-grid">
      ${qData.opts.map((o,i) => `
        <button class="answer-btn" onclick="selectAnswer(${i})" id="opt-${i}">
          <span class="letter">${LETTERS[i]}</span><span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="feedback-box" id="feedback"></div>
    <button class="next-btn ${q.color}" id="next-btn" onclick="nextQuestion()">
      ${currentQ < q.questions.length-1 ? 'Nächste Frage →' : 'Ergebnis anzeigen'}
    </button>`;
}

function selectAnswer(idx) {
  const qData = QUIZZES[currentQuiz].questions[currentQ];
  document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
  const isCorrect = idx === qData.a;
  if (isCorrect) score++;
  document.querySelectorAll('.answer-btn').forEach((b,i) => {
    if (i === qData.a) b.classList.add('correct');
    else if (i === idx && !isCorrect) b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<span class="feedback-icon">${isCorrect ? '✓' : '✗'}</span>
    <span>${isCorrect ? '<strong>Richtig!</strong> ' : '<strong>Falsch.</strong> Richtige Antwort: <em>'+qData.opts[qData.a]+'</em>. '}${qData.exp}</span>`;
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= QUIZZES[currentQuiz].questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  const q = QUIZZES[currentQuiz];
  const pct = Math.round((score / q.questions.length) * 100);
  document.getElementById('main-content').innerHTML = `
    <div class="result-screen">
      <span class="result-icon">${q.icon}</span>
      <h2>Quiz abgeschlossen!</h2>
      <div class="result-score">${score} / ${q.questions.length}</div>
      <p class="result-msg">${q.msg(pct)}</p>
      <div class="name-input-box">
        <label>Dein Name für die Bestenliste</label>
        <input type="text" id="player-name" placeholder="Name eingeben..." maxlength="20" />
      </div>
      <div class="controls" style="margin-bottom:32px;">
        <button class="btn-primary-${q.color}" id="submit-btn" onclick="submitScore()">🏆 Score eintragen</button>
        <button class="btn-secondary" onclick="initQuiz('${currentQuiz}')">↺ Nochmal</button>
        <button class="btn-secondary" onclick="goHome()">🏠 Startseite</button>
      </div>
      <div id="lb-section"><div class="lb-loading">Lade Bestenliste…</div></div>
    </div>`;
  loadAndShow('lb-section');
}

async function getLeaderboard() {
  try {
    const b = BIN[currentQuiz];
    const r = await fetch(`https://api.jsonbin.io/v3/b/${b.id}/latest`, { headers: { 'X-Master-Key': b.key } });
    const data = await r.json();
    return data.record.leaderboard || [];
  } catch { return []; }
}

async function saveScore(name, pts) {
  try {
    const b = BIN[currentQuiz];
    const entries = await getLeaderboard();
    entries.push({ name, score: pts, total: QUIZZES[currentQuiz].questions.length, date: new Date().toLocaleDateString('de-DE') });
    entries.sort((a,b) => b.score - a.score);
    const top = entries.slice(0, 20);
    await fetch(`https://api.jsonbin.io/v3/b/${b.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': b.key },
      body: JSON.stringify({ leaderboard: top })
    });
    return top;
  } catch { return []; }
}

async function submitScore() {
  const nameEl = document.getElementById('player-name');
  const name = nameEl?.value.trim();
  if (!name) { nameEl.style.borderColor = 'var(--wrong)'; return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Wird gespeichert…';
  const entries = await saveScore(name, score);
  btn.textContent = '✓ Eingetragen!';
  renderLB(document.getElementById('lb-section'), entries);
}

async function loadAndShow(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const entries = await getLeaderboard();
  renderLB(el, entries);
}

function renderLB(el, entries) {
  if (!entries.length) {
    el.innerHTML = `<div class="leaderboard"><div class="lb-title">🏆 Bestenliste</div><div class="lb-empty">Noch keine Einträge – sei der Erste!</div></div>`;
    return;
  }
  el.innerHTML = `<div class="leaderboard">
    <div class="lb-title">🏆 Bestenliste</div>
    ${entries.map((e,i) => `
      <div class="lb-item ${i<3?'rank-'+(i+1):''}">
        <span class="lb-rank">${i<3?MEDALS[i]:'#'+(i+1)}</span>
        <span class="lb-name">${e.name}</span>
        <span class="lb-score">${e.score}/${e.total}<span class="lb-pct"> (${Math.round(e.score/e.total*100)}%)</span></span>
      </div>`).join('')}
  </div>`;
}

async function initLeaderboard(type) {
  currentQuiz = type;
  const q = QUIZZES[type];
  document.getElementById('home').style.display = 'none';
  const hdr = document.getElementById('quiz-header');
  hdr.classList.add('show');
  document.getElementById('hdr-subtitle').textContent = q.sublabel;
  document.getElementById('hdr-subtitle').className = 'subtitle ' + q.color;
  document.getElementById('hdr-title').innerHTML = `${q.label} – Bestenliste`;
  document.getElementById('quiz-main').classList.add('show');
  document.getElementById('main-content').innerHTML = `
    <div id="lb-section" style="max-width:600px;margin:0 auto;">
      <div class="lb-loading">Lade Bestenliste…</div>
    </div>
    <div style="text-align:center;margin-top:28px;">
      <button class="btn-primary-${q.color}" onclick="initQuiz('${type}')">▶ Quiz starten</button>
      <button class="btn-secondary" style="margin-left:12px;" onclick="goHome()">🏠 Startseite</button>
    </div>`;
  loadAndShow('lb-section');
}
</script>
</body>
