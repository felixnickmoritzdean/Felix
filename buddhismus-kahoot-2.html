<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddhismus Kahoot – Gegenstände & Kleidung</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8871A;
    --gold: #F5C842;
    --maroon: #7B1E2A;
    --cream: #FDF6E3;
    --ink: #1A1208;
    --muted: #8B7355;
    --correct: #2E8B5A;
    --wrong: #C0392B;
    --bg: #0F0A04;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--cream);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* Mandala background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(232,135,26,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(123,30,42,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(245,200,66,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    text-align: center;
    padding: 48px 24px 32px;
    border-bottom: 2px solid rgba(232,135,26,0.3);
    z-index: 1;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--saffron);
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(245,200,66,0.3);
  }

  h1 span { color: var(--saffron); }

  .meta {
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  button {
    padding: 10px 24px;
    border-radius: 6px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--saffron);
    color: var(--ink);
  }
  .btn-primary:hover { background: var(--gold); transform: translateY(-1px); }

  .btn-secondary {
    background: transparent;
    border: 1.5px solid var(--muted);
    color: var(--cream);
  }
  .btn-secondary:hover { border-color: var(--saffron); color: var(--saffron); }

  main {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 0;
  }

  .mode-label {
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
  }

  /* ── QUIZ MODE ── */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .q-counter {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .score-badge {
    background: rgba(232,135,26,0.15);
    border: 1px solid var(--saffron);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 700;
  }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin-bottom: 32px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--saffron), var(--gold));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .question-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(232,135,26,0.2);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    backdrop-filter: blur(8px);
  }

  .question-text {
    font-family: 'Noto Serif', serif;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    line-height: 1.55;
    color: var(--cream);
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  @media (max-width: 540px) {
    .answers-grid { grid-template-columns: 1fr; }
  }

  .answer-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: var(--cream);
    font-size: 0.95rem;
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s;
    line-height: 1.3;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: var(--saffron);
    background: rgba(232,135,26,0.08);
    transform: translateY(-1px);
  }

  .answer-btn .letter {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    font-weight: 700;
    font-size: 0.8rem;
    flex-shrink: 0;
    transition: all 0.18s;
  }

  .answer-btn.correct {
    border-color: var(--correct);
    background: rgba(46,139,90,0.15);
  }
  .answer-btn.correct .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .answer-btn.wrong {
    border-color: var(--wrong);
    background: rgba(192,57,43,0.12);
    opacity: 0.7;
  }
  .answer-btn.wrong .letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .answer-btn:disabled { cursor: default; }

  .feedback-box {
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.95rem;
    display: none;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.5;
  }

  .feedback-box.show { display: flex; }

  .feedback-box.correct-fb {
    background: rgba(46,139,90,0.15);
    border: 1px solid rgba(46,139,90,0.4);
    color: #7FD4A8;
  }

  .feedback-box.wrong-fb {
    background: rgba(192,57,43,0.12);
    border: 1px solid rgba(192,57,43,0.35);
    color: #E88882;
  }

  .feedback-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }

  .next-btn {
    width: 100%;
    padding: 14px;
    background: var(--saffron);
    color: var(--ink);
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    display: none;
    transition: all 0.2s;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--gold); }

  /* ── RESULT SCREEN ── */
  .result-screen {
    text-align: center;
    padding: 40px 20px;
  }

  .result-lotus { font-size: 5rem; margin-bottom: 24px; display: block; }

  .result-screen h2 {
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .result-score {
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--saffron);
    margin: 16px 0;
  }

  .result-msg {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 32px;
    font-family: 'Noto Serif', serif;
    font-style: italic;
  }

  /* ── LIST MODE ── */
  .list-mode .q-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(232,135,26,0.15);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .list-mode .q-num {
    display: inline-block;
    background: var(--saffron);
    color: var(--ink);
    font-weight: 900;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .list-mode .q-text {
    font-family: 'Noto Serif', serif;
    font-size: 1rem;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .list-mode .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  @media (max-width: 540px) {
    .list-mode .opts { grid-template-columns: 1fr; }
  }

  .list-mode .opt {
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 0.88rem;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    display: flex;
    gap: 8px;
  }

  .list-mode .opt.is-correct {
    border-color: rgba(46,139,90,0.5);
    background: rgba(46,139,90,0.1);
    color: #7FD4A8;
  }

  .list-mode .opt .ltr {
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }

  .list-mode .opt.is-correct .ltr { color: #7FD4A8; }

  .list-mode .explanation {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.5;
    padding-left: 4px;
    border-left: 2px solid rgba(232,135,26,0.3);
    padding-left: 10px;
  }

  /* hidden helpers */
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <div class="subtitle">☸ Kahoot-Fragen</div>
  <h1>Buddhismus:<br><span>Gegenstände & Kleidung</span></h1>
  <p class="meta">25 Fragen · Klasse / Quiz / Unterricht</p>
  <div class="controls">
    <button class="btn-primary" onclick="startQuiz()">▶ Quiz starten</button>
    <button class="btn-secondary" onclick="showList()">📋 Alle Fragen ansehen</button>
  </div>
</header>

<main id="main-content">
  <p class="mode-label">Wähle einen Modus oben aus</p>
</main>

<script>
const questions = [
  {
    q: "Welche Farbe haben die Roben der buddhistischen Mönche in Südostasien traditionell?",
    opts: ["Safrangelb / Orange", "Weiß", "Blau", "Schwarz"],
    a: 0,
    exp: "In Theravāda-Ländern wie Thailand oder Sri Lanka tragen Mönche traditionell safrangelbe oder orangefarbene Roben (Kāsāya)."
  },
  {
    q: "Wie heißt das dreigeteilte Mönchsgewand im Theravāda-Buddhismus?",
    opts: ["Trikāya", "Tīcīvara", "Kāsāya", "Rakusu"],
    a: 1,
    exp: "Das Tīcīvara besteht aus drei Teilen: dem Antaravāsaka (Untergewand), dem Uttarāsanga (Obergewand) und dem Saṅghāti (Mantel)."
  },
  {
    q: "Was ist ein Rakusu im Zen-Buddhismus?",
    opts: ["Ein Gebetsbuch", "Eine kleine Robe um den Hals", "Ein Meditationskissen", "Eine Gebetskette"],
    a: 1,
    exp: "Das Rakusu ist ein kleines, schürzenartiges Gewand, das Zen-Praktizierende nach der Jukai-Zeremonie (Gelübde) um den Hals tragen."
  },
  {
    q: "Wie viele Perlen hat ein buddhistischer Rosenkranz (Mālā) in der Regel?",
    opts: ["54", "99", "108", "72"],
    a: 2,
    exp: "Die buddhistische Mālā hat traditionell 108 Perlen, eine heilige Zahl im Buddhismus, die u. a. die 108 Leidenschaften symbolisiert."
  },
  {
    q: "Wie heißt die Bettelschale, die Mönche auf dem Almosengang tragen?",
    opts: ["Pātra", "Stūpa", "Thangka", "Vajra"],
    a: 0,
    exp: "Der Pātra (Sanskrit) bzw. Patta (Pāli) ist die Almosenschale, die Mönche bei sich tragen, um Speisen entgegenzunehmen."
  },
  {
    q: "Was ist ein Stūpa?",
    opts: ["Ein Mönchsgewand", "Ein Meditationsmantra", "Ein Reliquienbauwerk", "Ein Ritualwerkzeug"],
    a: 2,
    exp: "Ein Stūpa ist ein halbkugelförmiges buddhistisches Bauwerk, das oft Reliquien des Buddha oder bedeutender Mönche enthält."
  },
  {
    q: "Welches Instrument wird in buddhistischen Klöstern zur Zeitangabe und zum Läuten des Gebets genutzt?",
    opts: ["Sitar", "Klangschale", "Tabla", "Sitar"],
    a: 1,
    exp: "Tibetische und asiatische Klangschalen (Singing Bowls) werden in Klöstern für Meditation, Rituale und zur Zeitangabe genutzt."
  },
  {
    q: "Was symbolisiert der Vajra (Donnerkeil) im tibetischen Buddhismus?",
    opts: ["Mitgefühl und Weisheit", "Unzerstörbarkeit und erleuchtenden Geist", "Reichtum und Glück", "Reinheit und Stille"],
    a: 1,
    exp: "Der Vajra steht für die Unzerstörbarkeit und Festigkeit des erleuchteten Geistes; er wird bei tantristischen Ritualen mit der Glocke (Ghanta) kombiniert."
  },
  {
    q: "Wie heißt die rituelle Handglocke, die zusammen mit dem Vajra verwendet wird?",
    opts: ["Mālā", "Thangka", "Ghanta", "Gyaling"],
    a: 2,
    exp: "Die Ghanta (Glocke) repräsentiert Weisheit; kombiniert mit dem Vajra (Mittel) bildet sie die Einheit von Weisheit und Mittelwegen im Tantra."
  },
  {
    q: "Was ist ein Thangka?",
    opts: ["Ein tibetisches Rollbild mit religiösen Motiven", "Ein Gebetstuch aus Nepal", "Ein buddhistisches Kochbuch", "Ein Meditationssitz"],
    a: 0,
    exp: "Thangkas sind gemalte oder gewebte tibetische Rollbilder, die Buddhas, Bodhisattvas oder Mandalas darstellen und als Meditationsobjekte dienen."
  },
  {
    q: "Welche Farbe tragen Mönche im tibetischen Buddhismus meist?",
    opts: ["Weiß und Gold", "Dunkelrot / Bordeaux", "Grün und Blau", "Schwarz und Silber"],
    a: 1,
    exp: "Tibetisch-buddhistische Mönche tragen traditionell dunkelrote (maroon) Roben, manchmal mit gelben Elementen bei Zeremonien."
  },
  {
    q: "Was ist ein Mandala im buddhistischen Kontext?",
    opts: ["Ein Klostergebäude", "Ein heiliges geometrisches Diagramm des Universums", "Eine Art Bettelschale", "Ein Meditationsmantra"],
    a: 1,
    exp: "Ein Mandala ist ein geometrisches, kosmisches Diagramm, das den Palast einer Gottheit und das Universum symbolisiert; es dient der Konzentration und Visualisation."
  },
  {
    q: "Wie heißt das buddhistische Gebetsrad, das gläubige Tibeter drehen?",
    opts: ["Mani-Khor", "Stupā", "Pātra", "Rakusu"],
    a: 0,
    exp: "Das Mani-Khor (tibetisch: Mani Chos 'khor) ist ein Gebetsrad, das eine aufgerollte Mantrarolle enthält; jede Umdrehung gilt als Rezitation des Mantras."
  },
  {
    q: "Was steht auf den meisten tibetischen Gebetsrädern und Gebetsfahnen?",
    opts: ["Om mani padme hum", "Namo Amida Butsu", "Gate gate pāragate", "Anicca vatta sankhara"],
    a: 0,
    exp: "Das Mantra 'Om mani padme hum' ist dem Bodhisattva Avalokiteśvara gewidmet und das am weitesten verbreitete Mantra im tibetischen Buddhismus."
  },
  {
    q: "Welches Objekt benutzen Mönche als Fächer / Wedel bei Zeremonien in Theravāda-Ländern?",
    opts: ["Talapatra (Palmblattfächer)", "Khakkhara (Pilgerstab)", "Hossu (Staubbesen)", "Chowrie (Yaakschwanzwedel)"],
    a: 0,
    exp: "Der Talapatra, ein fächerartiges Schild aus Palmblatt, wird von Theravāda-Mönchen bei Zeremonien vor das Gesicht gehalten."
  },
  {
    q: "Was ist ein Khakkhara?",
    opts: ["Eine Mönchsglocke", "Ein Pilgerstab mit klingelnden Ringen", "Ein Meditationskissen", "Ein Ritualkelch"],
    a: 1,
    exp: "Der Khakkhara ist ein buddhistischer Pilgerstab, dessen metallene Ringe beim Gehen klappern – ursprünglich um Insekten zu warnen und nicht zu töten."
  },
  {
    q: "Was ist der Hossu im Zen-Buddhismus?",
    opts: ["Ein kurzes Schwert", "Ein Staubbesen aus Tierhaaren als Symbol der Reinheit", "Ein Gebetsbuch", "Ein Zenpuzzle (Kōan-Buch)"],
    a: 1,
    exp: "Der Hossu ist ein ritueller Staubbesen aus weißem Yak- oder Pferdehaar, den Zen-Meister als Symbol ihrer Autorität bei Lehrveranstaltungen tragen."
  },
  {
    q: "Welche Farbe tragen Nonnen im japanischen Zen-Buddhismus (Sōtō-Schule) traditionell?",
    opts: ["Orange", "Schwarz", "Weiß", "Grau"],
    a: 1,
    exp: "Im japanischen Buddhismus tragen Mönche und Nonnen traditionell schwarze oder graue Roben (Koromo), mit farbigen Kesas für Zeremonien."
  },
  {
    q: "Was ist ein Kesa (Kesā) im japanischen Buddhismus?",
    opts: ["Ein zeremonielles Schultertuch über der Robe", "Ein Meditationssitz", "Ein Gebetsstock", "Ein Tempel-Gong"],
    a: 0,
    exp: "Das Kesa ist das aus Flicken genähte, zeremoniell bedeutsame Schultertuch, das die ursprüngliche Mönchsrobe (Kāsāya) symbolisiert."
  },
  {
    q: "Was symbolisiert der Lotus (Padma) als buddhistisches Symbol häufig?",
    opts: ["Leiden und Vergänglichkeit", "Reinheit und Erleuchtung trotz Schmutz", "Reichtum und Macht", "Zorn und Kraft"],
    a: 1,
    exp: "Der Lotus wächst aus dem Schlamm, bleibt aber makellos sauber – ein Sinnbild für Erleuchtung, die im Leiden entsteht, und für Reinheit des Geistes."
  },
  {
    q: "Wie heißt das traditionelle Kleidungsstück, das buddhistische Laien in Myanmar bei Festen tragen?",
    opts: ["Longyi", "Dhoti", "Sarong", "Kurta"],
    a: 0,
    exp: "Der Longyi ist ein zylindrisch gewickeltes Tuch, das sowohl von Mönchen (in roter Variante) als auch von Laien in Myanmar getragen wird."
  },
  {
    q: "Was ist ein Sand-Mandala im tibetischen Buddhismus?",
    opts: ["Ein bemaltes Tuch für Gebete", "Ein aus farbigem Sand aufwändig gelegtes Mandala, das danach aufgelöst wird", "Ein Sandstein-Reliquiar", "Ein gemauerte Klosteranlage"],
    a: 1,
    exp: "Das Sand-Mandala (Tibetisch: kalachakra) wird von Mönchen über Tage aufwändig aus farbigem Sand gelegt und danach rituell aufgelöst – als Symbol der Vergänglichkeit."
  },
  {
    q: "Was sind Gebetsfahnen (Lungta) im tibetischen Buddhismus?",
    opts: ["Fahnen mit Mantras, die der Wind verbreitet", "Dekorative Tempelfahnen ohne religiöse Bedeutung", "Fahnen für buddhistische Feste und Prozessionen", "Fahnen, die den Verstorbenen zeigen"],
    a: 0,
    exp: "Lungta (Windpferd) sind bunte Gebetsfahnen mit Mantras, Gebeten und Symbolen; der Wind soll die Gebete in alle Richtungen tragen."
  },
  {
    q: "Welches der folgenden Objekte gehört NICHT zu den Acht Glückssymbolen (Ashtamangala)?",
    opts: ["Endloser Knoten", "Lotusblüte", "Vajra (Donnerkeil)", "Goldene Fische"],
    a: 2,
    exp: "Der Vajra gehört nicht zu den Acht Glückssymbolen. Die Ashtamangala umfassen u. a. Endloser Knoten, Lotus, Goldene Fische, Schatzgefäß, Siegesbanner, Sonnenschirm, Dharma-Rad und Muschelhorn."
  },
  {
    q: "Was ist die Funktion der langen Hörner (Dungchen) in tibetisch-buddhistischen Klöstern?",
    opts: ["Als Kommunikationsmittel zwischen Klöstern", "Zur Begleitung von Zeremonien und Ritualen", "Zum Vertreiben böser Geister in der Nacht", "Als Rangabzeichen des Abtes"],
    a: 1,
    exp: "Die Dungchen sind bis zu vier Meter lange Kupferhörner, deren tiefer Klang Zeremonien, Gebete und Rituale im Kloster begleitet und eine meditative Atmosphäre schafft."
  }
];

let currentQ = 0, score = 0, mode = null;
const LETTERS = ['A','B','C','D'];

function startQuiz() {
  mode = 'quiz';
  currentQ = 0;
  score = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const pct = (currentQ / questions.length) * 100;
  document.getElementById('main-content').innerHTML = `
    <div class="quiz-header">
      <span class="q-counter">Frage ${currentQ + 1} von ${questions.length}</span>
      <span class="score-badge">✦ ${score} Punkte</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question-card">
      <p class="question-text">${q.q}</p>
    </div>
    <div class="answers-grid">
      ${q.opts.map((o, i) => `
        <button class="answer-btn" onclick="selectAnswer(${i})" id="opt-${i}">
          <span class="letter">${LETTERS[i]}</span>
          <span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="feedback-box" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">
      ${currentQ < questions.length - 1 ? 'Nächste Frage →' : 'Ergebnis anzeigen'}
    </button>
  `;
}

function selectAnswer(idx) {
  const q = questions[currentQ];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  const isCorrect = idx === q.a;
  if (isCorrect) score++;
  btns.forEach((b, i) => {
    if (i === q.a) b.classList.add('correct');
    else if (i === idx && !isCorrect) b.classList.add('wrong');
  });
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<span class="feedback-icon">${isCorrect ? '✓' : '✗'}</span>
    <span>${isCorrect ? '<strong>Richtig!</strong> ' : '<strong>Falsch.</strong> Die richtige Antwort war: <em>' + q.opts[q.a] + '</em>. '}${q.exp}</span>`;
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  const pct = Math.round((score / questions.length) * 100);
  let msg = pct === 100 ? '„Der Weg des Wissens ist eröffnet." – Vollkommenes Ergebnis!' :
            pct >= 80 ? '„Weisheit wächst Schritt für Schritt." – Ausgezeichnet!' :
            pct >= 60 ? '„Auch der längste Weg beginnt mit dem ersten Schritt." – Gut gemacht!' :
            pct >= 40 ? '„Ausdauer ist der Weg zur Erleuchtung." – Weitermachen!' :
            '„Anfängergeist ist der beste Geist." – Übe weiter!';
  document.getElementById('main-content').innerHTML = `
    <div class="result-screen">
      <span class="result-lotus">☸</span>
      <h2>Quiz abgeschlossen!</h2>
      <div class="result-score">${score} / ${questions.length}</div>
      <p class="result-msg">${msg}</p>
      <div class="controls">
        <button class="btn-primary" onclick="startQuiz()">↺ Nochmal spielen</button>
        <button class="btn-secondary" onclick="showList()">📋 Alle Fragen ansehen</button>
      </div>
    </div>`;
}

function showList() {
  mode = 'list';
  document.getElementById('main-content').innerHTML = `
    <p class="mode-label">Alle 25 Fragen mit Lösungen</p>
    <div class="list-mode">
      ${questions.map((q, qi) => `
        <div class="q-item">
          <span class="q-num">Frage ${qi + 1}</span>
          <p class="q-text">${q.q}</p>
          <div class="opts">
            ${q.opts.map((o, i) => `
              <div class="opt ${i === q.a ? 'is-correct' : ''}">
                <span class="ltr">${LETTERS[i]}.</span>
                <span>${o}</span>
              </div>`).join('')}
          </div>
          <p class="explanation">💡 ${q.exp}</p>
        </div>`).join('')}
    </div>
    <div style="text-align:center;margin-top:32px;">
      <button class="btn-primary" onclick="startQuiz()">▶ Quiz starten</button>
    </div>`;
}
</script>
</body>
</html>
