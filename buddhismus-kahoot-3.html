<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddhismus Kahoot – Gegenstände & Kleidung</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --saffron: #E8871A; --gold: #F5C842; --cream: #FDF6E3; --ink: #1A1208; --muted: #8B7355; --correct: #2E8B5A; --wrong: #C0392B; --bg: #0F0A04; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--cream); min-height: 100vh; padding: 0 0 60px; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 20%, rgba(232,135,26,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(123,30,42,0.12) 0%, transparent 50%); pointer-events: none; z-index: 0; }
  header { position: relative; text-align: center; padding: 48px 24px 32px; border-bottom: 2px solid rgba(232,135,26,0.3); z-index: 1; }
  .subtitle { font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--saffron); margin-bottom: 12px; }
  h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; line-height: 1.1; color: var(--gold); text-shadow: 0 0 40px rgba(245,200,66,0.3); }
  h1 span { color: var(--saffron); }
  .meta { margin-top: 16px; font-size: 0.9rem; color: var(--muted); }
  .controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  button { padding: 10px 24px; border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--saffron); color: var(--ink); }
  .btn-primary:hover { background: var(--gold); transform: translateY(-1px); }
  .btn-secondary { background: transparent; border: 1.5px solid var(--muted); color: var(--cream); }
  .btn-secondary:hover { border-color: var(--saffron); color: var(--saffron); }
  main { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 40px 20px 0; }
  .mode-label { text-align: center; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 28px; }
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .q-counter { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.1em; }
  .score-badge { background: rgba(232,135,26,0.15); border: 1px solid var(--saffron); border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; color: var(--gold); font-weight: 700; }
  .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 32px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--saffron), var(--gold)); border-radius: 3px; transition: width 0.4s ease; }
  .question-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(232,135,26,0.2); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
  .question-text { font-family: 'Noto Serif', serif; font-size: clamp(1rem, 2.5vw, 1.3rem); line-height: 1.55; color: var(--cream); }
  .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (max-width: 540px) { .answers-grid { grid-template-columns: 1fr; } }
  .answer-btn { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: var(--cream); font-size: 0.95rem; font-weight: 400; text-align: left; cursor: pointer; transition: all 0.18s; line-height: 1.3; }
  .answer-btn:hover:not(:disabled) { border-color: var(--saffron); background: rgba(232,135,26,0.08); transform: translateY(-1px); }
  .answer-btn .letter { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12); font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
  .answer-btn.correct { border-color: var(--correct); background: rgba(46,139,90,0.15); }
  .answer-btn.correct .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .answer-btn.wrong { border-color: var(--wrong); background: rgba(192,57,43,0.12); opacity: 0.7; }
  .answer-btn.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .answer-btn:disabled { cursor: default; }
  .feedback-box { border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 0.95rem; display: none; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .feedback-box.show { display: flex; }
  .feedback-box.correct-fb { background: rgba(46,139,90,0.15); border: 1px solid rgba(46,139,90,0.4); color: #7FD4A8; }
  .feedback-box.wrong-fb { background: rgba(192,57,43,0.12); border: 1px solid rgba(192,57,43,0.35); color: #E88882; }
  .feedback-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
  .next-btn { width: 100%; padding: 14px; background: var(--saffron); color: var(--ink); border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; display: none; transition: all 0.2s; }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--gold); }
  .result-screen { text-align: center; padding: 40px 20px; }
  .result-lotus { font-size: 5rem; margin-bottom: 24px; display: block; }
  .result-screen h2 { font-size: 2rem; font-weight: 900; color: var(--gold); margin-bottom: 8px; }
  .result-score { font-size: 3.5rem; font-weight: 900; color: var(--saffron); margin: 16px 0; }
  .result-msg { color: var(--muted); font-size: 1rem; margin-bottom: 24px; font-family: 'Noto Serif', serif; font-style: italic; }
  .name-input-box { margin: 20px auto; max-width: 400px; }
  .name-input-box label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
  .name-input-box input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(232,135,26,0.4); border-radius: 8px; color: var(--cream); font-family: 'Outfit', sans-serif; font-size: 1rem; outline: none; }
  .name-input-box input:focus { border-color: var(--saffron); }
  .leaderboard { margin-top: 8px; }
  .lb-title { font-size: 1.1rem; font-weight: 900; color: var(--gold); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .lb-empty { color: var(--muted); font-size: 0.9rem; font-style: italic; text-align: center; padding: 20px; }
  .lb-item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); }
  .lb-item.rank-1 { background: rgba(245,200,66,0.1); border-color: rgba(245,200,66,0.3); }
  .lb-item.rank-2 { background: rgba(192,192,192,0.08); border-color: rgba(192,192,192,0.2); }
  .lb-item.rank-3 { background: rgba(205,127,50,0.08); border-color: rgba(205,127,50,0.2); }
  .lb-rank { font-size: 1.2rem; width: 30px; text-align: center; flex-shrink: 0; }
  .lb-name { flex: 1; font-weight: 700; font-size: 0.95rem; }
  .lb-score { font-weight: 900; color: var(--saffron); font-size: 1rem; }
  .lb-pct { font-size: 0.75rem; color: var(--muted); margin-left: 4px; }
  .lb-loading { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 20px; }
  .lb-error { text-align: center; color: #E88882; font-size: 0.85rem; padding: 16px; }
</style>
</head>
<body>
<header>
  <div class="subtitle">☸ Kahoot-Fragen</div>
  <h1>Buddhismus:<br><span>Gegenstände & Kleidung</span></h1>
  <p class="meta">25 Fragen · Klasse / Quiz / Unterricht</p>
  <div class="controls">
    <button class="btn-primary" onclick="startQuiz()">▶ Quiz starten</button>
    <button class="btn-secondary" onclick="showLeaderboard()">🏆 Bestenliste</button>
  </div>
</header>
<main id="main-content">
  <p class="mode-label">Wähle einen Modus oben aus</p>
</main>

<script>
const BIN_ID = '6a0edbf9ee5a733b12f632c3';
const API_KEY = '$2a$10$QuIgyYUjVCaW3k1lu99X4OtVftpfSmgoCH.nKO/N5chl7WHh9ol5m';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const MEDALS = ['🥇','🥈','🥉'];
const LETTERS = ['A','B','C','D'];

const questions = [
  { q: "Welche Farbe haben die Roben der buddhistischen Mönche in Südostasien traditionell?", opts: ["Safrangelb / Orange", "Weiß", "Blau", "Schwarz"], a: 0, exp: "In Theravāda-Ländern wie Thailand oder Sri Lanka tragen Mönche traditionell safrangelbe oder orangefarbene Roben (Kāsāya)." },
  { q: "Wie heißt das dreigeteilte Mönchsgewand im Theravāda-Buddhismus?", opts: ["Trikāya", "Tīcīvara", "Kāsāya", "Rakusu"], a: 1, exp: "Das Tīcīvara besteht aus drei Teilen: Antaravāsaka (Untergewand), Uttarāsanga (Obergewand) und Saṅghāti (Mantel)." },
  { q: "Was ist ein Rakusu im Zen-Buddhismus?", opts: ["Ein Gebetsbuch", "Eine kleine Robe um den Hals", "Ein Meditationskissen", "Eine Gebetskette"], a: 1, exp: "Das Rakusu ist ein kleines Gewand, das Zen-Praktizierende nach der Jukai-Zeremonie um den Hals tragen." },
  { q: "Wie viele Perlen hat ein buddhistischer Rosenkranz (Mālā) in der Regel?", opts: ["54", "99", "108", "72"], a: 2, exp: "Die buddhistische Mālā hat traditionell 108 Perlen, eine heilige Zahl im Buddhismus." },
  { q: "Wie heißt die Bettelschale, die Mönche auf dem Almosengang tragen?", opts: ["Pātra", "Stūpa", "Thangka", "Vajra"], a: 0, exp: "Der Pātra ist die Almosenschale, die Mönche bei sich tragen, um Speisen entgegenzunehmen." },
  { q: "Was ist ein Stūpa?", opts: ["Ein Mönchsgewand", "Ein Meditationsmantra", "Ein Reliquienbauwerk", "Ein Ritualwerkzeug"], a: 2, exp: "Ein Stūpa ist ein buddhistisches Bauwerk, das oft Reliquien des Buddha enthält." },
  { q: "Welches Instrument wird in buddhistischen Klöstern zur Meditation genutzt?", opts: ["Sitar", "Klangschale", "Tabla", "Bongos"], a: 1, exp: "Tibetische Klangschalen werden in Klöstern für Meditation und Rituale genutzt." },
  { q: "Was symbolisiert der Vajra (Donnerkeil) im tibetischen Buddhismus?", opts: ["Mitgefühl und Weisheit", "Unzerstörbarkeit und erleuchtenden Geist", "Reichtum und Glück", "Reinheit und Stille"], a: 1, exp: "Der Vajra steht für die Unzerstörbarkeit und Festigkeit des erleuchteten Geistes." },
  { q: "Wie heißt die rituelle Handglocke, die zusammen mit dem Vajra verwendet wird?", opts: ["Mālā", "Thangka", "Ghanta", "Gyaling"], a: 2, exp: "Die Ghanta (Glocke) repräsentiert Weisheit und wird kombiniert mit dem Vajra verwendet." },
  { q: "Was ist ein Thangka?", opts: ["Ein tibetisches Rollbild mit religiösen Motiven", "Ein Gebetstuch aus Nepal", "Ein buddhistisches Kochbuch", "Ein Meditationssitz"], a: 0, exp: "Thangkas sind gemalte tibetische Rollbilder, die Buddhas oder Mandalas darstellen." },
  { q: "Welche Farbe tragen Mönche im tibetischen Buddhismus meist?", opts: ["Weiß und Gold", "Dunkelrot / Bordeaux", "Grün und Blau", "Schwarz und Silber"], a: 1, exp: "Tibetisch-buddhistische Mönche tragen traditionell dunkelrote (maroon) Roben." },
  { q: "Was ist ein Mandala im buddhistischen Kontext?", opts: ["Ein Klostergebäude", "Ein heiliges geometrisches Diagramm des Universums", "Eine Art Bettelschale", "Ein Meditationsmantra"], a: 1, exp: "Ein Mandala ist ein geometrisches, kosmisches Diagramm, das das Universum symbolisiert." },
  { q: "Wie heißt das buddhistische Gebetsrad, das gläubige Tibeter drehen?", opts: ["Mani-Khor", "Stupā", "Pātra", "Rakusu"], a: 0, exp: "Das Mani-Khor ist ein Gebetsrad mit einer Mantrarolle; jede Umdrehung gilt als Rezitation." },
  { q: "Was steht auf den meisten tibetischen Gebetsrädern und Gebetsfahnen?", opts: ["Om mani padme hum", "Namo Amida Butsu", "Gate gate pāragate", "Anicca vatta sankhara"], a: 0, exp: "Das Mantra 'Om mani padme hum' ist dem Bodhisattva Avalokiteśvara gewidmet." },
  { q: "Welches Objekt halten Theravāda-Mönche bei Zeremonien vor das Gesicht?", opts: ["Talapatra (Palmblattfächer)", "Khakkhara (Pilgerstab)", "Hossu (Staubbesen)", "Chowrie (Wedel)"], a: 0, exp: "Der Talapatra ist ein Fächer aus Palmblatt, der bei Zeremonien vor das Gesicht gehalten wird." },
  { q: "Was ist ein Khakkhara?", opts: ["Eine Mönchsglocke", "Ein Pilgerstab mit klingelnden Ringen", "Ein Meditationskissen", "Ein Ritualkelch"], a: 1, exp: "Der Khakkhara ist ein Pilgerstab mit Metallringen, die beim Gehen klappern." },
  { q: "Was ist der Hossu im Zen-Buddhismus?", opts: ["Ein kurzes Schwert", "Ein Staubbesen aus Tierhaaren als Symbol der Reinheit", "Ein Gebetsbuch", "Ein Kōan-Buch"], a: 1, exp: "Der Hossu ist ein ritueller Staubbesen, den Zen-Meister als Symbol ihrer Autorität tragen." },
  { q: "Welche Farbe tragen Mönche im japanischen Zen (Sōtō-Schule) traditionell?", opts: ["Orange", "Schwarz", "Weiß", "Grau"], a: 1, exp: "Im japanischen Buddhismus tragen Mönche traditionell schwarze oder graue Roben (Koromo)." },
  { q: "Was ist ein Kesa im japanischen Buddhismus?", opts: ["Ein zeremonielles Schultertuch über der Robe", "Ein Meditationssitz", "Ein Gebetsstock", "Ein Tempel-Gong"], a: 0, exp: "Das Kesa ist ein aus Flicken genähtes Schultertuch, das die ursprüngliche Mönchsrobe symbolisiert." },
  { q: "Was symbolisiert der Lotus (Padma) als buddhistisches Symbol häufig?", opts: ["Leiden und Vergänglichkeit", "Reinheit und Erleuchtung trotz Schmutz", "Reichtum und Macht", "Zorn und Kraft"], a: 1, exp: "Der Lotus wächst aus dem Schlamm, bleibt aber makellos – ein Sinnbild für Erleuchtung." },
  { q: "Wie heißt das traditionelle Kleidungsstück buddh. Laien in Myanmar?", opts: ["Longyi", "Dhoti", "Sarong", "Kurta"], a: 0, exp: "Der Longyi ist ein zylindrisch gewickeltes Tuch, das in Myanmar getragen wird." },
  { q: "Was ist ein Sand-Mandala im tibetischen Buddhismus?", opts: ["Ein bemaltes Tuch für Gebete", "Ein aus farbigem Sand gelegtes Mandala, das danach aufgelöst wird", "Ein Sandstein-Reliquiar", "Eine gemauerte Klosteranlage"], a: 1, exp: "Das Sand-Mandala wird aus farbigem Sand gelegt und danach aufgelöst – Symbol der Vergänglichkeit." },
  { q: "Was sind Gebetsfahnen (Lungta) im tibetischen Buddhismus?", opts: ["Fahnen mit Mantras, die der Wind verbreitet", "Dekorative Tempelfahnen ohne religiöse Bedeutung", "Fahnen für buddhistische Prozessionen", "Fahnen für Verstorbene"], a: 0, exp: "Lungta sind bunte Fahnen mit Mantras; der Wind soll die Gebete in alle Richtungen tragen." },
  { q: "Welches Objekt gehört NICHT zu den Acht Glückssymbolen (Ashtamangala)?", opts: ["Endloser Knoten", "Lotusblüte", "Vajra (Donnerkeil)", "Goldene Fische"], a: 2, exp: "Der Vajra gehört nicht zu den Acht Glückssymbolen (Ashtamangala)." },
  { q: "Was ist die Funktion der langen Hörner (Dungchen) in tibetischen Klöstern?", opts: ["Als Kommunikationsmittel zwischen Klöstern", "Zur Begleitung von Zeremonien und Ritualen", "Zum Vertreiben böser Geister", "Als Rangabzeichen des Abtes"], a: 1, exp: "Die Dungchen sind bis zu vier Meter lange Kupferhörner, die Zeremonien begleiten." }
];

let currentQ = 0, score = 0;

async function getLeaderboard() {
  try {
    const r = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
    const data = await r.json();
    return data.record.leaderboard || [];
  } catch { return []; }
}

async function saveScore(name, pts) {
  try {
    const entries = await getLeaderboard();
    entries.push({ name, score: pts, total: questions.length, date: new Date().toLocaleDateString('de-DE') });
    entries.sort((a, b) => b.score - a.score);
    const top = entries.slice(0, 20);
    await fetch(BIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify({ leaderboard: top })
    });
    return top;
  } catch { return []; }
}

function startQuiz() {
  currentQ = 0; score = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const pct = (currentQ / questions.length) * 100;
  document.getElementById('main-content').innerHTML = `
    <div class="quiz-header">
      <span class="q-counter">Frage ${currentQ + 1} von ${questions.length}</span>
      <span class="score-badge">✦ ${score} Punkte</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question-card"><p class="question-text">${q.q}</p></div>
    <div class="answers-grid">
      ${q.opts.map((o, i) => `
        <button class="answer-btn" onclick="selectAnswer(${i})" id="opt-${i}">
          <span class="letter">${LETTERS[i]}</span><span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="feedback-box" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">
      ${currentQ < questions.length - 1 ? 'Nächste Frage →' : 'Ergebnis anzeigen'}
    </button>`;
}

function selectAnswer(idx) {
  const q = questions[currentQ];
  document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
  const isCorrect = idx === q.a;
  if (isCorrect) score++;
  document.querySelectorAll('.answer-btn').forEach((b, i) => {
    if (i === q.a) b.classList.add('correct');
    else if (i === idx && !isCorrect) b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<span class="feedback-icon">${isCorrect ? '✓' : '✗'}</span>
    <span>${isCorrect ? '<strong>Richtig!</strong> ' : '<strong>Falsch.</strong> Richtige Antwort: <em>' + q.opts[q.a] + '</em>. '}${q.exp}</span>`;
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  const pct = Math.round((score / questions.length) * 100);
  let msg = pct === 100 ? '„Der Weg des Wissens ist eröffnet." – Vollkommenes Ergebnis!' :
            pct >= 80 ? '„Weisheit wächst Schritt für Schritt." – Ausgezeichnet!' :
            pct >= 60 ? '„Auch der längste Weg beginnt mit dem ersten Schritt." – Gut gemacht!' :
            pct >= 40 ? '„Ausdauer ist der Weg zur Erleuchtung." – Weitermachen!' :
            '„Anfängergeist ist der beste Geist." – Übe weiter!';
  document.getElementById('main-content').innerHTML = `
    <div class="result-screen">
      <span class="result-lotus">☸</span>
      <h2>Quiz abgeschlossen!</h2>
      <div class="result-score">${score} / ${questions.length}</div>
      <p class="result-msg">${msg}</p>
      <div class="name-input-box">
        <label>Dein Name für die Bestenliste</label>
        <input type="text" id="player-name" placeholder="Name eingeben..." maxlength="20" />
      </div>
      <div class="controls" style="margin-bottom:32px;">
        <button class="btn-primary" id="submit-btn" onclick="submitScore()">🏆 Score eintragen</button>
        <button class="btn-secondary" onclick="startQuiz()">↺ Nochmal spielen</button>
      </div>
      <div id="lb-section"><div class="lb-loading">Lade Bestenliste…</div></div>
    </div>`;
  loadAndShow('lb-section');
}

async function submitScore() {
  const nameEl = document.getElementById('player-name');
  const name = nameEl?.value.trim();
  if (!name) { nameEl.style.borderColor = 'var(--wrong)'; return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Wird gespeichert…';
  const entries = await saveScore(name, score);
  btn.textContent = '✓ Eingetragen!';
  renderLB(document.getElementById('lb-section'), entries);
}

async function loadAndShow(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const entries = await getLeaderboard();
  renderLB(el, entries);
}

function renderLB(el, entries) {
  if (!entries.length) {
    el.innerHTML = `<div class="leaderboard"><div class="lb-title">🏆 Bestenliste</div><div class="lb-empty">Noch keine Einträge – sei der Erste!</div></div>`;
    return;
  }
  el.innerHTML = `<div class="leaderboard">
    <div class="lb-title">🏆 Bestenliste</div>
    ${entries.map((e, i) => `
      <div class="lb-item ${i < 3 ? 'rank-'+(i+1) : ''}">
        <span class="lb-rank">${i < 3 ? MEDALS[i] : '#'+(i+1)}</span>
        <span class="lb-name">${e.name}</span>
        <span class="lb-score">${e.score}/${e.total}<span class="lb-pct"> (${Math.round(e.score/e.total*100)}%)</span></span>
      </div>`).join('')}
  </div>`;
}

async function showLeaderboard() {
  document.getElementById('main-content').innerHTML = `
    <div id="lb-section" style="max-width:600px;margin:0 auto;">
      <div class="lb-loading">Lade Bestenliste…</div>
    </div>
    <div style="text-align:center;margin-top:28px;">
      <button class="btn-primary" onclick="startQuiz()">▶ Quiz starten</button>
    </div>`;
  loadAndShow('lb-section');
}
</script>
</body>
</html>
